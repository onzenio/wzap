name: wzap

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wzap:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: wzap_test
          POSTGRES_USER: wzap
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wzap -d wzap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WZAP_TEST_DATABASE_URL: postgres://wzap:secret@127.0.0.1:5432/wzap_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Test
        run: go test ./...

      - name: Swagger docs freshness
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.6 init --parseInternal -g internal/httpapi/swagger.go -o docs
          git diff --exit-code -- docs/

      - name: Build
        run: go build ./...

      message:
        type: string
    type: object
  httpapi.errorEnvelope:
    properties:
      error:
        $ref: '#/definitions/httpapi.errorBody'
    type: object
  httpapi.identityResponse:
    properties:
      email:
        type: string
      id:
        type: string
      role:
        type: string
    type: object
  httpapi.instanceListResponse:
    properties:
      items:

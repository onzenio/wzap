      qr_expires_at:
        type: string
      status:
        type: string
    type: object
  httpapi.createInstanceRequest:
    properties:
      external_ref:
        type: string
      name:
        type: string
      owner_user_id:
        type: string
      webhook_enabled:
        type: boolean
      webhook_events:
        items:
          type: string
        type: array
      webhook_url:
        type: string
    type: object
  httpapi.createInstanceResponse:
    properties:
      created_at:
        type: string
      external_ref:
        type: string
      id:
        type: string
      instance_api_key:
        type: string
      last_connected_at:
        type: string
      last_error:
        type: string
      name:
        type: string
      owner_user_id:
        type: string
      status:
        type: string
      updated_at:
        type: string
      webhook_enabled:
        type: boolean
      webhook_events:
        items:
          type: string
        type: array
      webhook_url:
        type: string
      whatsapp_jid:
        type: string
    type: object
  httpapi.createUserRequest:

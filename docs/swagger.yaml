      status:
        type: string
    type: object
  httpapi.rotateAPIKeyResponse:
    properties:
      id:
        type: string
      instance_api_key:
        type: string
    type: object
  httpapi.sendContactRequest:
    properties:
      display_name:
        type: string
      to:
        type: string

          $ref: '#/definitions/httpapi.instanceResponse'
        type: array
      next_cursor:
        type: string
    type: object
  httpapi.instanceResponse:
    properties:
      created_at:
        type: string
      external_ref:
        type: string
      id:
        type: string
      last_connected_at:
        type: string
      last_error:
        type: string
      name:
        type: string
      owner_user_id:
        type: string
      status:
        type: string
      updated_at:
        type: string
      webhook_enabled:
        type: boolean
      webhook_events:
        items:
          type: string
        type: array
      webhook_url:
        type: string
      whatsapp_jid:
        type: string
    type: object
  httpapi.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  httpapi.logoutResponse:
    properties:
      status:

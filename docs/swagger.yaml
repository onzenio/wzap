          $ref: '#/definitions/httpapi.messageResponse'
        type: array
      next_cursor:
        type: string
    type: object
  httpapi.messageResponse:
    properties:
      attempts:
        type: integer
      created_at:
        type: string
      delivered_at:
        type: string
      id:
        type: string
      instance_id:
        type: string
      last_error:
        type: string
      read_at:
        type: string
      recipient:
        type: string
      status:
        type: string
      type:
        type: string
      updated_at:
        type: string
      whatsapp_message_id:
        type: string
    type: object
  httpapi.numberCheckRequest:
    properties:
      phone:
        type: string
    type: object
  httpapi.numberCheckResponse:
    properties:
      exists:
        type: boolean
      jid:
        type: string

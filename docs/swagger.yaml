        type: string
    type: object
  httpapi.userQuotaResponse:
    properties:
      email:
        type: string
      id:
        type: string
      instance_quota:
        type: integer
      role:
        type: string
    type: object
info:
  contact: {}
  description: 'Standalone multi-instance WhatsApp gateway. Authenticated REST commands
    plus durable events; every success body is wrapped in a {"data": ...} envelope
    and every failure in a {"error": {"code", "message"}} envelope.'
  title: wzap
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Verifies the email/password credentials and mints the wzap_session
        cookie. Unknown email and wrong password share one 401 response.
      parameters:
      - description: Correlation id, echoed back
        in: header
        name: X-Request-Id
        type: string
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Identity, wrapped in the data envelope; the wzap_session cookie
            is set
          schema:
            $ref: '#/definitions/httpapi.identityResponse'
        "400":
          description: Malformed body
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
      summary: Log in to the manager session
      tags:
      - auth
  /auth/logout:
    post:
      description: Clears the wzap_session cookie. There are no server-side sessions.
      parameters:
      - description: Correlation id, echoed back
        in: header
        name: X-Request-Id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Status, wrapped in the data envelope
          schema:
            $ref: '#/definitions/httpapi.logoutResponse'
      summary: Log out of the manager session
      tags:
      - auth
  /auth/me:
    get:
      description: Answers the identity of the wzap_session cookie holder, 401 without
        a valid session.
      parameters:
      - description: Correlation id, echoed back
        in: header
        name: X-Request-Id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Identity, wrapped in the data envelope
          schema:
            $ref: '#/definitions/httpapi.identityResponse'
        "401":
          description: Missing or invalid session
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
      summary: Show the current manager session
      tags:
      - auth
  /healthz:
    get:
      description: Reports liveness without authentication. The process is alive whenever
        it replies.
      parameters:
      - description: Correlation id, echoed back
        in: header
        name: X-Request-Id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'Enveloped {\"status\": \"ok\"}'
          schema:
            type: string
      summary: Liveness probe
      tags:
      - health
  /instances:
    get:
      parameters:
      - description: Global key or user session credential scope
        in: header
        name: apikey
        required: true
        type: string
      - description: Correlation id, echoed back
        in: header
        name: X-Request-Id
        type: string
      - description: Page size, default 50, max 100
        in: query
        name: limit
        type: integer
      - description: Opaque pagination cursor
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: One page, wrapped in the data envelope
          schema:
            $ref: '#/definitions/httpapi.instanceListResponse'
        "400":
          description: Invalid cursor
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "401":
          description: Missing or invalid credential
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "403":
          description: Instance keys own no collection view
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
      security:
      - apikey: []
      summary: List instances
      tags:
      - instances
    post:
      consumes:
      - application/json
      parameters:
      - description: Global key or user session credential scope
        in: header
        name: apikey
        required: true
        type: string
      - description: Correlation id, echoed back
        in: header
        name: X-Request-Id
        type: string
      - description: Instance payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.createInstanceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created, wrapped in the data envelope
          schema:
            $ref: '#/definitions/httpapi.createInstanceResponse'
        "400":
          description: Malformed body
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "401":
          description: Missing or invalid credential
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "403":
          description: Forbidden or quota exceeded
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "409":
          description: External ref already taken
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "413":
          description: Body exceeds the 1 MiB limit
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "422":
          description: Unknown owner or invalid webhook config
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
      security:
      - apikey: []
      summary: Create an instance
      tags:
      - instances
  /instances/{id}:
    delete:
      parameters:
      - description: Global, owning user, or own instance key
        in: header
        name: apikey
        required: true
        type: string
      - description: Correlation id, echoed back
        in: header
        name: X-Request-Id
        type: string
      - description: Instance ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Deleted, no body
        "401":
          description: Missing or invalid credential
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "403":
          description: Not the owner
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "404":
          description: Instance not found
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
      security:
      - apikey: []
      summary: Delete an instance
      tags:
      - instances
    get:
      parameters:
      - description: Global, owning user, or own instance key
        in: header
        name: apikey
        required: true
        type: string
      - description: Correlation id, echoed back
        in: header
        name: X-Request-Id
        type: string
      - description: Instance ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Instance, wrapped in the data envelope
          schema:
            $ref: '#/definitions/httpapi.instanceResponse'
        "401":
          description: Missing or invalid credential
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "403":
          description: Not the owner
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "404":
          description: Instance not found
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
      security:
      - apikey: []
      summary: Get an instance
      tags:
      - instances
    patch:
      consumes:
      - application/json
      parameters:
      - description: Global, owning user, or own instance key
        in: header
        name: apikey
        required: true
        type: string
      - description: Correlation id, echoed back
        in: header
        name: X-Request-Id
        type: string
      - description: Instance ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Partial update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.updateInstanceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated instance, wrapped in the data envelope
          schema:
            $ref: '#/definitions/httpapi.instanceResponse'
        "400":
          description: Malformed body or invalid cursor
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "401":
          description: Missing or invalid credential
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "403":
          description: Not the owner
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "404":
          description: Instance not found
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "409":
          description: External ref already taken
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "413":
          description: Body exceeds the 1 MiB limit
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "422":
          description: Invalid webhook config
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/httpapi.errorEnvelope'
      security:
      - apikey: []
      summary: Update an instance
      tags:
      - instances
  /instances/{id}/apikey:
    delete:
      parameters:
      - description: Global key or admin session scope
        in: header
        name: apikey
        required: true
        type: string
      - description: Correlation id, echoed back
